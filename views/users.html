<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Library Users</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <header>

        <h1>
            Library Users
        </h1>

        <a
            href="index.html"
            class="back-button"
        >
            ← Back to Books
        </a>

    </header>


    <main>

        <section class="users-section">

            <div class="users-header">

                <h2>
                    Registered Users
                </h2>

                <a
                    href="add-user.html"
                    class="add-book-button"
                >
                    + Add New User
                </a>

            </div>


            <div class="user-search">

                <label for="userSearch">
                    Search Users
                </label>

                <input
                    type="text"
                    id="userSearch"
                    placeholder="Search by name or email..."
                >

            </div>


            <div id="usersContainer">

                <p>
                    Loading users...
                </p>

            </div>

        </section>

    </main>


    <script
        type="module"
        src="../js/users.js"
    ></script>

</body>

</html>
