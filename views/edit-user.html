<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit User</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

    <header>

        <h1>
            Edit User
        </h1>

    </header>


    <main>

        <section class="form-section">

            <h2>
                Update User
            </h2>


            <form id="editUserForm">


                <div class="form-group">

                    <label>
                        User ID
                    </label>

                    <input
                        type="text"
                        id="userId"
                        readonly
                    >

                </div>


                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                    >

                    <span
                        id="nameError"
                        class="error"
                    ></span>

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                    >

                    <span
                        id="emailError"
                        class="error"
                    ></span>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="text"
                        id="phone"
                        maxlength="10"
                    >

                    <span
                        id="phoneError"
                        class="error"
                    ></span>

                </div>


                <button type="submit">
                    Update User
                </button>


                <a href="users.html">
                    Cancel
                </a>

            </form>

        </section>

    </main>


    <script
        type="module"
        src="../js/editUser.js"
    ></script>

</body>

</html>
